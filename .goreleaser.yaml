version: 2

project_name: agented

before:
  hooks:
    - go mod tidy

builds:
  - id: ae
    main: ./cmd/ae
    binary: ae
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: ae
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999


brews:
  - name: agented
    repository:
      owner: frane
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Skip the brew step entirely when the secret is missing, so cutting a
    # release does not fail just because the tap is not yet provisioned.
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ else }}auto{{ end }}'
    homepage: "https://github.com/frane/agented"
    description: "Stateful, persistent text editor for LLM agents (verb-based, SQLite undo tree)."
    license: "Apache-2.0"
    install: |
      bin.install "ae"
    test: |
      assert_match "ae version", shell_output("#{bin}/ae --version")
    commit_author:
      name: agented-release
      email: release@agented.dev
    caveats: |
      ae is a stateful editor for LLM agents. After install, run:
        ae skill install
      to drop the SKILL.md into your Claude/Codex/Cursor skills directory.

release:
  github:
    owner: frane
    name: agented
  draft: false
  prerelease: auto
  mode: keep-existing
  header: |
    ## agented {{.Tag}}

    A text editor for LLMs.
  footer: |
    **Full Changelog**: https://github.com/frane/agented/compare/{{ .PreviousTag }}...{{ .Tag }}
